name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install --yes rpm

      - name: Test
        run: go test -mod=readonly -race -count=1 ./...

      - name: Build Linux and Windows packages
        run: |
          go tool mygo build \
            -platform linux/amd64,linux/arm64,windows/amd64,windows/arm64 \
            -skip-installer

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release
          cp build/linux-amd64/*.deb release/
          cp build/linux-amd64/*.rpm release/
          cp build/linux-amd64/*.tar.gz release/
          cp build/linux-arm64/*.deb release/
          cp build/linux-arm64/*.rpm release/
          cp build/linux-arm64/*.tar.gz release/
          cp build/windows-amd64/Pausepoint.exe release/Pausepoint-windows-amd64.exe
          cp build/windows-arm64/Pausepoint.exe release/Pausepoint-windows-arm64.exe
          find release -type f -print | sort

      - name: Upload Linux and Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: pausepoint-linux-windows
          path: release/
          if-no-files-found: error

  build-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -mod=readonly ./...

      - name: Build unsigned universal DMG
        run: go tool mygo build -platform darwin/universal -sign "-"

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: pausepoint-macos
          path: build/darwin-universal/*.dmg
          if-no-files-found: error

  publish:
    needs: build-linux-windows
    runs-on: ubuntu-24.04
    steps:
      - name: Download Linux and Windows packages
        uses: actions/download-artifact@v8
        with:
          name: pausepoint-linux-windows
          path: release

      - name: Download macOS package
        uses: actions/download-artifact@v8
        with:
          name: pausepoint-macos
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Pausepoint ${GITHUB_REF_NAME}" \
            --generate-notes \
            --prerelease

  upload-macos:
    needs: [build-macos, publish]
    runs-on: ubuntu-24.04
    steps:
      - name: Download macOS package
        uses: actions/download-artifact@v8
        with:
          name: pausepoint-macos
          path: release

      - name: Upload macOS package to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            release/* \
            --repo "${GITHUB_REPOSITORY}"
